
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit {{ note.title }} | Personal Notes</title>
</head>
<body>
    <h1>Edit Note</h1>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Save Changes</button>
    </form>

    <p>
        <a href="{% url 'notes:detail' note.pk %}">
            Cancel and return to note
        </a>
    </p>
</body>
</html>
