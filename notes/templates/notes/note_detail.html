
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ note.title }} | Personal Notes</title>
</head>
<body>
    <h1>{{ note.title }}</h1>

    <p>{{ note.content }}</p>

    <p>
        <small>Created: {{ note.created_at }}</small>
    </p>

    <p>
        <small>Last updated: {{ note.updated_at }}</small>
    </p>

    <a href="{% url 'notes:home' %}">Back to all notes</a>
</body>
</html>
